<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f0f4f8;
}

/* Title Box */
.title-box {
  display: inline-block;
  padding: 10px 30px;
  margin-top: 15px;
  background: linear-gradient(45deg, #e62121, #2196F3);
  color: white;
  font-size: 24px;
  font-weight: bold;
  border-radius: 8px;
}

/* Mode Selection */
.mode-container {
  margin-top: 15px;
}

.mode {
  display: inline-block;
  padding: 8px 18px;
  margin: 8px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  font-size: 14px;
}

.pvp { background-color: #3bd10d; }
.ai  { background-color: #b70d70; }

/* Reduced Outer Game Box */
.board {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  gap: 6px;
  justify-content: center;
  margin: 20px auto;
  padding: 10px;
  width: 270px;
  height: 270px;
  border: 4px solid #1019c3;
  border-radius: 12px;
  background: white;
  box-sizing: border-box;
}

.cell {
  width: 80px;
  height: 80px;
  font-size: 32px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #fafafa;
  border: 2px solid #d7e114;
  border-radius: 8px;
}

.cell:hover {
  background: #e3f2fd;
}

#status {
  font-size: 16px;
  font-weight: bold;
}

button {
  padding: 6px 14px;
  margin-top: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="title-box">Tic Tac Toe</div>

<div class="mode-container">
  <div class="mode pvp" onclick="setMode('pvp')">Player vs Player</div>
  <div class="mode ai" onclick="setMode('ai')">Player vs AI</div>
</div>

<div class="board" id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>

<div id="status">Select Mode to Start</div>
<button onclick="restartGame()">Restart</button>

<script>
const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");

let currentPlayer = "X";
let gameState = ["", "", "", "", "", "", "", "", ""];
let gameActive = false;
let mode = "";

const winningConditions = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function setMode(selectedMode) {
  mode = selectedMode;
  restartGame();
  gameActive = true;
  statusText.textContent = "Player X's Turn";
}

function handleCellClick(e) {
  const index = e.target.dataset.index;

  if (gameState[index] !== "" || !gameActive) return;

  gameState[index] = currentPlayer;
  e.target.textContent = currentPlayer;

  checkWinner();

  if (mode === "ai" && gameActive && currentPlayer === "O") {
    setTimeout(aiMove, 400);
  }
}

function aiMove() {
  let emptyCells = gameState
    .map((val, index) => val === "" ? index : null)
    .filter(val => val !== null);

  if (emptyCells.length === 0) return;

  let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
  gameState[randomIndex] = "O";
  cells[randomIndex].textContent = "O";

  checkWinner();
}

function checkWinner() {
  for (let condition of winningConditions) {
    const [a,b,c] = condition;
    if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
      statusText.textContent = `Player ${currentPlayer} Wins! 🎉`;
      gameActive = false;
      return;
    }
  }

  if (!gameState.includes("")) {
    statusText.textContent = "Game Draw 🤝";
    gameActive = false;
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  statusText.textContent = `Player ${currentPlayer}'s Turn`;
}

function restartGame() {
  gameState = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = false;
  statusText.textContent = "Select Mode to Start";
  cells.forEach(cell => cell.textContent = "");
}

cells.forEach(cell => cell.addEventListener("click", handleCellClick));
</script>

</body>
</html>
